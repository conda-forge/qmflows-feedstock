schema_version: 1

context:
  name: qmflows
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/qmflows-${{ version }}.tar.gz
  sha256: c4b3ba80345d7cb921b582d27c2597caa27d4890067be74de103dec15f9ed5a5

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - filelock
    - h5py
    - more-itertools
    - noodles >=0.3.3
    - numpy >=1.21,<2
    - packaging >=1.16.8
    - pandas
    - plams ==1.5.1
    - pyparsing !=3.0.0,<3.1.0
    - python >=${{ python_min }}
    - pyyaml >=5.1

tests:
  - python:
      imports:
        - qmflows
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Automation of computations in quantum chemistry
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE.md
  homepage: https://github.com/SCM-NV/qmflows

extra:
  recipe-maintainers:
    - jan-janssen
